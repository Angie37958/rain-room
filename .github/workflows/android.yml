name: Build Android APK
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Prepare Android SDK
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - name: Build signed offline APK
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.RAIN_ROOM_ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.RAIN_ROOM_ANDROID_KEYSTORE_PASSWORD }}
        run: |
          export ANDROID_SIGNING_KEYSTORE="$RUNNER_TEMP/rain-room.p12"
          trap 'rm -f "$ANDROID_SIGNING_KEYSTORE"' EXIT
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$ANDROID_SIGNING_KEYSTORE"
          bash scripts/build-android.sh
      - name: Enable emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Verify app launch on Android
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          disable-animations: true
          script: node scripts/smoke-android.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: rain-room-android
          path: |
            android/build/rain-room-0.12.1.apk
            android/build/rain-room-0.12.1.apk.sha256
            android/build/smoke/
